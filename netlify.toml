[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# As rotas conhecidas viram arquivos HTML reais na prerenderização
# (scripts/prerender.mjs) e o Netlify serve o arquivo antes de qualquer
# redirect. Só o que não existe chega aqui — e aí responde 404 de verdade.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/demonstracao/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
